{% extends "base.html" %}

{% block title %}Register - Flashcard Dungeon{% endblock %}

{% block nav %}{% endblock %}

{% block body %}
<main class="page-center">
    <div class="rpg-box auth-box">
        <h1>Guild Registration</h1>
        <div class="subtitle">Carve your name into the guild ledger</div>

        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Adventurer Name</label>
                <input type="text" id="username" name="username" placeholder="Choose a username..." required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password..." required>
            </div>
            <button type="submit" class="btn">Join the Guild</button>
        </form>

        <div class="link-text">
            Already have a profile? <a href="{% url 'login:login' %}">Log in</a>
        </div>
    </div>
</main>
{% endblock %}
