{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Flashcard Dungeon</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600&display=swap');
        /* color palette used: https://lospec.com/palette-list/summers-past-16 */

        :root {
            --brand-yellow: #f7d554;
        }

        body {
            background-image: url("https://i.pinimg.com/1200x/0c/1d/7e/0c1d7edba1eaa4d58dd1bcf5aed1295c.jpg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .rpg-box {
            background: rgba(20, 20, 28, 0.85);
            border: 2px solid var(--brand-yellow);
            border-radius: 12px;
            padding: 40px;
            width: 380px;
            box-shadow: 0 0 30px rgba(184, 151, 88, 0.15), inset 0 0 20px rgba(0,0,0,0.8);
            text-align: center;
            backdrop-filter: blur(5px);
        }
        h1 {
            font-family: 'VT323', monospace;
            color: var(--brand-yellow);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            font-size: 4.5rem;
            margin: 0 0 20px 0;
            line-height: 0.75;
        }
        .subtitle {
            font-family: 'VT323', monospace;
            color: #ece8c2;
            font-size: 1.3rem;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            font-size: 0.85rem;
            color: var(--brand-yellow);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: #0a0a0f;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: var(--brand-yellow);
            box-shadow: 0 0 12px rgba(184, 151, 88, 0.3);
            background: #111118;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: linear-gradient(to bottom, #e78c5b, var(--brand-yellow));
            border: 1px solid #eedc9a;
            border-radius: 6px;
            color: #0a0a0f;
            font-family: 'VT323', monospace;
            font-size: 1.8rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover {
            box-shadow: 0 0 20px rgba(184, 151, 88, 0.5);
            transform: translateY(-2px);
            background: linear-gradient(to bottom, #e78c5b, var(--brand-yellow));
        }
        button:active {
            transform: translateY(1px);
        }
        .link-text {
            font-size: 0.9rem;
            margin-top: 25px;
            color: #8c8c9e;
        }
        a {
            color: var(--brand-yellow);
            font-weight: 600;
            transition: all 0.3s;
        }
        a:hover {
            color: #eedc9a;
            text-shadow: 0 0 8px rgba(238, 220, 154, 0.4);
        }
    </style>
    <link rel="stylesheet" href="{% static 'css/login/login.css' %}">
</head>
<body>
    <div class="rpg-box">
        <h1>Flashcard Dungeon</h1>
        <div class="subtitle">"To Master The Cards, One Must First<br>Defeat the Dungeon"</div>
        
        <!-- Displays backend errors, like invalid credentials -->
        {% if error %}
            <p style="color: #e78c5b; font-weight: bold; margin-bottom: 15px;">{{ error }}</p>
        {% endif %}
        
        <!-- Securely posts data to the backend -->
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Adventurer Name</label>
                <input type="text" name="username" placeholder="Enter username..." required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password..." required>
            </div>
            <button type="submit">Enter Guild</button>
        </form>

        <div class="link-text">
            <!-- Routes to the register app dynamically -->
            New adventurer? <a href="{% url 'register:register' %}">Register</a>
        </div>
    </div>

    <script src="{% static 'js/login/login.js' %}"></script>
</body>
</html>
