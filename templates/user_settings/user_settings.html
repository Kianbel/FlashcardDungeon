{% extends "base.html" %}

{% block title %}Settings - Flashcard Dungeon{% endblock %}

{% block content %}
<div class="rpg-box narrow">
    <h2 class="section-title">📖 Account Settings</h2>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Change Adventurer Name</label>
            <input type="text" id="username" name="username" value="{{ user.username }}" placeholder="Update username...">
        </div>
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" placeholder="Leave blank to keep current...">
        </div>
        <button type="submit" class="btn">Update Ledger</button>
    </form>

    <div class="danger-zone">
        <h3>☠️ Danger Zone</h3>
        <form method="post" action="{% url 'user_settings:delete_account' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger"
                    onclick="return confirm('Are you sure you want to delete your profile? All dungeon progress will be lost.')">
                Retire from Guild (Delete Account)
            </button>
        </form>
    </div>
</div>
{% endblock %}
