{% extends "base.html" %}

{% block title %}Quarters - Flashcard Dungeon{% endblock %}

{% block content %}
<div class="parchment narrow">
    <h2>Your Quarters</h2>

    <form method="post">
        {% csrf_token %}
        <div class="field">
            <label for="username">Adventurer Name</label>
            <input type="text" id="username" name="username" value="{{ user.username }}">
        </div>
        <div class="field">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" placeholder="Leave blank to keep the current one...">
        </div>
        <button type="submit" class="btn-wood">Update Ledger</button>
    </form>

    <div class="danger-zone">
        <h3>Retire from the Guild</h3>
        <form method="post" action="{% url 'user_settings:delete_account' %}">
            {% csrf_token %}
            <button type="submit" class="btn-wood btn-danger"
                    onclick="return confirm('Retire for good? All dungeons and progress will be lost.')">Delete Account</button>
        </form>
    </div>
</div>
{% endblock %}
